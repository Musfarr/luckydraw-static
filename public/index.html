  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script>
      $(document).ready(function () {
        $(".loadingbar").delay(1500).animate({ left: "0" }, 3000);
        $(".loadingBox").delay(500).animate({ opacity: "1" }, 1000);
        // $(".splashScreen").delay(4500).animate({ top: "-101%" }, 1500);
        setTimeout(() => {
          $(".splashScreen").delay(2000).animate({ opacity: "0" }, 500);
          $(".splashBehind").delay(5000).animate({ opacity: "1" }, 500);
        }, 2200);

        $(document).ready(function () {
          // Check if the URL contains "/special-page"
          if (window.location.href.indexOf("/welcome") > -1) {
            $("body")
              .delay(5000)
              .queue(function () {
                $("body").addClass("visibleSplash");
              });
          } else {
            // Remove the class from the body on other pages
            $("body").removeClass("visibleSplash");
          }
        });
      });
    </script>
  </body>
